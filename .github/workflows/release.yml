name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            archive_ext: zip

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross (aarch64-linux only)
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Archive binary (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          VERSION=${{ github.ref_name }}
          BINARY=code-looper-${VERSION}-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/code-looper "${BINARY}"
          tar -czf "${BINARY}.tar.gz" "${BINARY}"

      - name: Archive binary (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}"
          $BINARY = "code-looper-${VERSION}-${{ matrix.target }}"
          Copy-Item "target/${{ matrix.target }}/release/code-looper.exe" "${BINARY}.exe"
          Compress-Archive -Path "${BINARY}.exe" -DestinationPath "${BINARY}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: code-looper-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Detect pre-release
        id: prerelease
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/* \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            ${{ steps.prerelease.outputs.flag }}

      - name: Close milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          MILESTONE=$(gh api "repos/${{ github.repository }}/milestones" \
            --jq ".[] | select(.title == \"${VERSION}\") | .number")
          if [ -n "$MILESTONE" ]; then
            gh api "repos/${{ github.repository }}/milestones/${MILESTONE}" \
              --method PATCH -f state=closed
            echo "Closed milestone ${VERSION} (#${MILESTONE})"
          else
            echo "No open milestone titled ${VERSION} — skipping"
          fi
